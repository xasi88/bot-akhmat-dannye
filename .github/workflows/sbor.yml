name: Сбор данных
on:
  schedule:
    - cron: '7,37 * * * *'   # раз в 30 минут (время UTC)
  workflow_dispatch:
concurrency:
  group: sbor
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  sobrat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Данные
        run: node server/sobrat.mjs .
      - name: Сохранить
        run: |
          git config user.name "bot-akhmat"
          git config user.email "bot-akhmat@users.noreply.github.com"
          git add akhmat.json
          git diff --cached --quiet || (git commit -q -m "Данные $(date -u +%F_%H:%M)" && git push -q)
